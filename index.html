<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BadTeam</title>
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="BadTeam – Spieler, Gruppen und Anwesenheit im Badminton-Training">
  <meta name="apple-mobile-web-app-title" content="BadTeam">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Farbschema früh setzen (kein Aufblitzen): auto | light | dark
    try { const t = localStorage.getItem('badteam-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    /* Startbildschirm: Logo als Ladekreis, erst nach kurzer Zeit sichtbar (schnelles Laden = kein Aufblitzen) */
    #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0b0d10; transition: opacity .25s; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) #boot { background: #f2f3f5; } }
    :root[data-theme="light"] #boot { background: #f2f3f5; }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot svg { opacity: 0; animation: bf-in .3s .35s forwards, bf-spin 1.6s linear infinite; }
    #boot circle { transform-box: fill-box; transform-origin: center; animation: bf-pulse 1.2s ease-in-out infinite; }
    @keyframes bf-in { to { opacity: 1; } }
    @keyframes bf-spin { to { transform: rotate(360deg); } }
    @keyframes bf-pulse { 0%, 100% { transform: scale(.65); opacity: .55; } 40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><svg viewBox="-100 -100 200 200" width="64" height="64"><circle cx="0" cy="-62" r="21" fill="#e8193c"/><circle cx="43.8" cy="-43.8" r="21" fill="#ff8a1f" style="animation-delay:0.12s"/><circle cx="62" cy="0" r="21" fill="#c6f432" style="animation-delay:0.24s"/><circle cx="43.8" cy="43.8" r="21" fill="#2ee69b" style="animation-delay:0.36s"/><circle cx="0" cy="62" r="21" fill="#22d3ee" style="animation-delay:0.48s"/><circle cx="-43.8" cy="43.8" r="21" fill="#4f7bff" style="animation-delay:0.6s"/><circle cx="-62" cy="0" r="21" fill="#b07cff" style="animation-delay:0.72s"/><circle cx="-43.8" cy="-43.8" r="21" fill="#ff4fd8" style="animation-delay:0.84s"/></svg></div>
  <script>setTimeout(function () { var b = document.getElementById("boot"); if (b) b.remove(); }, 8000); /* Sicherheitsnetz */</script>
  <header class="top">
    <a class="brand" href="#/"><span class="brand-mark" data-icon="logo"></span><span class="brand-name">Bad<b>Team</b></span></a>
    <nav id="nav"></nav>
    <button id="keys-btn" class="ib theme-btn keys-btn"><i data-icon="keyboard"></i></button>
    <a id="backup-btn" class="ib theme-btn" href="#/backup"></a>
    <button id="lang-btn" class="ib theme-btn"></button>
    <button id="theme-btn" class="ib theme-btn"></button>
    <button id="help-btn" class="ib theme-btn help-btn"><span data-icon="help"></span></button>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="view"></main>
  <dialog id="dlg"></dialog>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
